<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.svg" />
    <title>Houma حومة: Streets of Tunisia</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f14; font-family: Cairo, 'Segoe UI', system-ui, sans-serif; color: #fff; }
      canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }
      #fps { position: absolute; top: 10px; right: 12px; font: 600 13px/1.3 ui-monospace, monospace; color: #c8ffc8; background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 6px; display: none; white-space: pre; text-align: right; }
      #zone { position: absolute; top: 26px; left: 50%; transform: translateX(-50%); font-weight: 700; font-size: 24px; letter-spacing: .04em; text-shadow: 0 2px 10px rgba(0,0,0,.7); opacity: 0; transition: opacity .8s; text-align: center; }
      #zone small { display: block; font-size: 17px; font-weight: 400; opacity: .9; }
      #prompt { position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%); background: rgba(10,14,22,.62); border: 1px solid rgba(255,255,255,.18); padding: 8px 16px; border-radius: 10px; font-size: 16px; opacity: 0; transition: opacity .2s; backdrop-filter: blur(4px); }
      #prompt b { display: inline-block; min-width: 22px; text-align: center; background: #fff; color: #111; border-radius: 5px; padding: 0 6px; margin-right: 8px; }
      #speedo { position: absolute; right: 28px; bottom: 26px; text-align: right; opacity: 0; transition: opacity .3s; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
      #speedo .v { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
      #speedo .u { font-size: 14px; opacity: .8; letter-spacing: .1em; }
      #speedo .n { font-size: 14px; opacity: .85; margin-bottom: 4px; }
      #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        background: radial-gradient(ellipse at center, rgba(8,12,20,.15) 0%, rgba(8,12,20,.72) 100%); cursor: pointer; transition: opacity .6s; }
      #title h1 { margin: 0; font-size: clamp(64px, 11vw, 150px); font-weight: 700; letter-spacing: .06em; line-height: .95; text-shadow: 0 6px 40px rgba(0,0,0,.55); }
      #title h1 span { display: block; font-size: .55em; letter-spacing: 0; color: #ffd98a; }
      #title .tag { font-size: clamp(16px, 2vw, 24px); letter-spacing: .32em; text-transform: uppercase; margin-top: 12px; opacity: .92; }
      #title .play { margin-top: 44px; font-size: 20px; font-weight: 700; padding: 13px 44px; border-radius: 999px; background: #1f6fb5; border: 2px solid rgba(255,255,255,.85); box-shadow: 0 8px 30px rgba(0,0,0,.4); }
      #title .keys { margin-top: 30px; font-size: 14px; opacity: .85; line-height: 1.9; max-width: 720px; }
      #title .keys b { background: rgba(255,255,255,.92); color: #111; border-radius: 4px; padding: 1px 7px; margin: 0 3px 0 10px; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; background: #0d0f14; font-size: 18px; letter-spacing: .1em; transition: opacity .5s; }
      #loading .ar { font-size: 72px; color: #ffd98a; font-weight: 700; }
      .hidden { opacity: 0 !important; pointer-events: none !important; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="fps"></div>
      <div id="zone"></div>
      <div id="prompt"></div>
      <div id="speedo"><div class="n"></div><div class="v">0</div><div class="u">KM/H</div></div>
    </div>
    <div id="title" class="hidden">
      <h1>HOUMA<span>حومة</span></h1>
      <div class="tag">Streets of Tunisia</div>
      <div class="play">Play</div>
      <div class="keys">
        <b>W A S D</b> move / drive <b>Mouse</b> camera <b>Shift</b> run <b>Space</b> jump / handbrake<br />
        <b>F</b> enter / exit car <b>H</b> horn <b>R</b> reset car <b>F3</b> FPS <b>Esc</b> pause
      </div>
    </div>
    <div id="loading"><div class="ar">حومة</div><div id="loadtext">Loading the city…</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
